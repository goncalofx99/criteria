<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CRITERIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; }

    html, body { height: 100%; background: #fafaf8; overflow: hidden; }

    /* ── App iframe ── */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #fafaf8;
    }

    /* ── No-target screen (dev mode, no URL set) ── */
    #no-target {
      display: none;
      position: fixed;
      inset: 0;
      background: #344e41;
      color: #fff;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }

    #no-target .logo { font-size: 26px; font-weight: 700; letter-spacing: 0.12em; color: #f5f0e8; }
    #no-target .hint { font-size: 13px; color: rgba(255,255,255,0.5); }

    /* ── Debug FAB ── */
    #debug-fab {
      display: none; /* shown only in DEV_MODE */
      position: fixed;
      right: 16px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(0,0,0,0.45);
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    /* ── Debug panel ── */
    #debug-panel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10000;
      background: rgba(0,0,0,0.6);
      align-items: flex-end;
      justify-content: center;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    .panel-sheet {
      background: #1c1c1e;
      border-radius: 16px 16px 0 0;
      padding: 20px 20px calc(16px + env(safe-area-inset-bottom, 0px));
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    .panel-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-align: center;
    }

    .panel-sheet input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      -webkit-appearance: none;
      width: 100%;
    }

    .panel-sheet input::placeholder { color: rgba(255,255,255,0.25); }
    .panel-sheet input:focus { border-color: rgba(255,255,255,0.3); }

    .panel-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-connect { background: #f5f0e8; color: #344e41; }
    .btn-clear   { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); font-size: 13px; padding: 10px; }
    .btn-dismiss { background: transparent; color: rgba(255,255,255,0.35); font-size: 13px; padding: 8px; }

    .current-target {
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      text-align: center;
      word-break: break-all;
      line-height: 1.5;
    }

    .current-target b { color: rgba(255,255,255,0.6); font-weight: 500; }
  </style>
</head>
<body>

<!-- App content (iframe fills screen) -->
<iframe id="app-frame" src="" allowfullscreen></iframe>

<!-- Shown when no URL is set -->
<div id="no-target">
  <div class="logo">CRITERIA</div>
  <div class="hint">Tap ⚙ to set a dev URL</div>
</div>

<!-- Debug FAB (dev mode only) -->
<button id="debug-fab" onclick="openPanel()">⚙</button>

<!-- Debug panel (bottom sheet) -->
<div id="debug-panel" onclick="handleBackdropClick(event)">
  <div class="panel-sheet">
    <div class="panel-title">Dev Server</div>
    <div class="current-target" id="current-display"></div>
    <input
      id="url-input"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="http://192.168.x.x:5173"
    />
    <button class="panel-btn btn-connect" onclick="connect()">Connect</button>
    <button class="panel-btn btn-clear" onclick="clearUrl()">Disconnect</button>
    <button class="panel-btn btn-dismiss" onclick="closePanel()">Cancel</button>
  </div>
</div>

<script>
  var DEV_MODE = true   // ← set to false before publishing to production
  var PROD_URL = ''     // ← set once deployed, e.g. 'https://criteria.vercel.app'
  var KEY = 'criteria_dev_url'

  var frame   = document.getElementById('app-frame')
  var fab     = document.getElementById('debug-fab')
  var panel   = document.getElementById('debug-panel')
  var noTarget = document.getElementById('no-target')
  var urlInput = document.getElementById('url-input')

  function getUrl() {
    return DEV_MODE
      ? (localStorage.getItem(KEY) || PROD_URL || null)
      : PROD_URL || null
  }

  function loadUrl(url) {
    if (!url) {
      frame.style.display = 'none'
      noTarget.style.display = 'flex'
      return
    }
    noTarget.style.display = 'none'
    frame.style.display = 'block'
    frame.src = url
  }

  function openPanel() {
    var current = localStorage.getItem(KEY)
    var display = document.getElementById('current-display')
    if (current) {
      display.innerHTML = 'Connected to <b>' + current + '</b>'
      urlInput.value = current
    } else if (PROD_URL) {
      display.innerHTML = 'Using <b>production</b>'
      urlInput.value = ''
    } else {
      display.innerHTML = 'No URL set'
      urlInput.value = ''
    }
    panel.style.display = 'flex'
    setTimeout(function () { urlInput.focus() }, 150)
  }

  function closePanel() {
    panel.style.display = 'none'
  }

  function handleBackdropClick(e) {
    if (e.target === panel) closePanel()
  }

  function connect() {
    var val = urlInput.value.trim()
    if (!val) return
    localStorage.setItem(KEY, val)
    closePanel()
    loadUrl(val)
  }

  function clearUrl() {
    localStorage.removeItem(KEY)
    closePanel()
    loadUrl(PROD_URL || null)
  }

  // Boot
  if (DEV_MODE) {
    fab.style.display = 'flex'
  }

  if (!DEV_MODE && !PROD_URL) {
    // Nothing to show — shouldn't happen in production
    noTarget.style.display = 'flex'
  } else {
    loadUrl(getUrl())
  }
</script>
</body>
</html>
