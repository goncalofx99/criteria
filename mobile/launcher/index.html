<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CRITERIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: #344e41;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
    }

    .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.12em; color: #f5f0e8; }

    .panel {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      padding: 13px 14px;
      outline: none;
      -webkit-appearance: none;
      width: 100%;
    }
    .panel input::placeholder { color: rgba(255,255,255,0.3); }
    .panel input:focus { border-color: rgba(255,255,255,0.4); }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: #f5f0e8; color: #344e41; }
    .btn-tertiary {
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      padding: 8px;
      font-weight: 500;
    }

    .status { font-size: 13px; color: rgba(255,255,255,0.6); text-align: center; min-height: 18px; }
    .status.error { color: #ffb4a8; }

    .url { font-size: 12px; color: rgba(255,255,255,0.6); text-align: center; word-break: break-all; line-height: 1.5; }
    .url b { color: rgba(255,255,255,0.9); font-weight: 500; }

    .hint { font-size: 12px; color: rgba(255,255,255,0.4); text-align: center; max-width: 320px; line-height: 1.6; }
    .hint code { background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; font-size: 11px; }

    .spinner {
      width: 24px; height: 24px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,0.2);
      border-top-color: #f5f0e8;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div id="screen">
  <div class="logo">CRITERIA</div>

  <!-- View: connecting -->
  <div id="view-connecting">
    <div class="spinner" style="margin: 0 auto;"></div>
    <p class="status" id="connecting-status" style="margin-top: 12px">Connecting…</p>
    <p class="url" id="connecting-url"></p>
  </div>

  <!-- View: error / can't reach -->
  <div id="view-error" class="panel hidden">
    <p class="status error" id="error-status">Couldn't reach the dev server.</p>
    <p class="url" id="error-url"></p>
    <button class="btn btn-primary" onclick="retry()">Retry</button>
    <button class="btn btn-tertiary" onclick="showEditor()">Change URL</button>
    <p class="hint">
      Run <code>pnpm --filter frontend dev --host</code> on your computer.
    </p>
  </div>

  <!-- View: editor (no URL set, or user tapped Change URL) -->
  <div id="view-editor" class="panel hidden">
    <p class="status">Dev server URL</p>
    <input
      id="url-input"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="http://localhost:5173"
    />
    <button class="btn btn-primary" onclick="connect()">Connect</button>
    <button class="btn btn-tertiary" id="cancel-btn" onclick="returnToError()">Cancel</button>
    <p class="hint">
      iOS simulator can use <code>http://localhost:5173</code>.<br>
      Android emulator: <code>http://10.0.2.2:5173</code>.<br>
      Real devices: your Mac's LAN IP, e.g. <code>http://192.168.x.x:5173</code>.
    </p>
  </div>
</div>

<script>
  // Default URL injected by capacitor.config.ts at sync time from dev.config.json.
  var DEFAULT_DEV_URL = 'http://localhost:5173'

  // Production URL (when DEV_MODE=false). Set this when shipping.
  var DEV_MODE = true
  var PROD_URL = ''

  var KEY = 'criteria_dev_url'

  var connectingView = document.getElementById('view-connecting')
  var errorView = document.getElementById('view-error')
  var editorView = document.getElementById('view-editor')
  var connectingUrlEl = document.getElementById('connecting-url')
  var errorUrlEl = document.getElementById('error-url')
  var errorStatusEl = document.getElementById('error-status')
  var urlInput = document.getElementById('url-input')
  var cancelBtn = document.getElementById('cancel-btn')

  var lastUrl = null

  function getSavedUrl() {
    if (!DEV_MODE) return PROD_URL || null
    return localStorage.getItem(KEY) || DEFAULT_DEV_URL || null
  }

  function show(view) {
    connectingView.classList.add('hidden')
    errorView.classList.add('hidden')
    editorView.classList.add('hidden')
    view.classList.remove('hidden')
  }

  function showConnecting(url) {
    connectingUrlEl.innerHTML = '<b>' + escapeHtml(url) + '</b>'
    show(connectingView)
  }

  function showError(url, msg) {
    errorUrlEl.innerHTML = '<b>' + escapeHtml(url) + '</b>'
    if (msg) errorStatusEl.textContent = msg
    show(errorView)
  }

  function showEditor() {
    cancelBtn.classList.toggle('hidden', !lastUrl)
    urlInput.value = lastUrl || DEFAULT_DEV_URL
    show(editorView)
    setTimeout(function () { urlInput.focus() }, 100)
  }

  function returnToError() {
    if (lastUrl) showError(lastUrl, 'Couldn’t reach the dev server.')
    else show(errorView)
  }

  function connect() {
    var val = urlInput.value.trim()
    if (!val) return
    if (!/^https?:\/\//i.test(val)) val = 'http://' + val
    val = val.replace(/\/$/, '')
    localStorage.setItem(KEY, val)
    lastUrl = val
    attempt(val)
  }

  function retry() {
    if (lastUrl) attempt(lastUrl)
  }

  // Try a HEAD request before redirecting. If unreachable, show error.
  function attempt(url) {
    lastUrl = url
    showConnecting(url)
    var controller = new AbortController()
    var timeout = setTimeout(function () { controller.abort() }, 4000)
    fetch(url, { method: 'GET', mode: 'no-cors', cache: 'no-store', signal: controller.signal })
      .then(function () {
        clearTimeout(timeout)
        // Cache-bust to defeat any WKWebView module caching.
        var sep = url.indexOf('?') === -1 ? '?' : '&'
        window.location.replace(url + sep + '_b=' + Date.now())
      })
      .catch(function () {
        clearTimeout(timeout)
        showError(url, 'Couldn’t reach the dev server.')
      })
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]
    })
  }

  // Boot
  var initialUrl = getSavedUrl()
  if (initialUrl) {
    attempt(initialUrl)
  } else {
    showEditor()
  }
</script>
</body>
</html>
