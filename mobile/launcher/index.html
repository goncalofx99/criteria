<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>CRITERIA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

    html, body {
      height: 100%;
      background: #344e41;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    #screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 28px;
      padding: calc(env(safe-area-inset-top, 0px) + 48px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
    }

    .logo { font-size: 28px; font-weight: 700; letter-spacing: 0.12em; color: #f5f0e8; }

    .tabs {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: rgba(255,255,255,0.08);
      width: 100%;
      max-width: 320px;
    }
    .tab {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.6);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      border-radius: 8px;
      cursor: pointer;
      transition: background 150ms ease, color 150ms ease;
    }
    .tab.active {
      background: #f5f0e8;
      color: #344e41;
    }

    .panel {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 200ms ease;
    }
    .panel.hidden { display: none; }

    .label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.45);
      text-align: center;
    }
    .url {
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      text-align: center;
      word-break: break-all;
      line-height: 1.5;
      padding: 12px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
    }
    .hint {
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      text-align: center;
      line-height: 1.55;
    }

    .presets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .preset {
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.85);
      font-size: 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .preset:active { background: rgba(255,255,255,0.14); }

    input[type="url"] {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      padding: 13px 14px;
      outline: none;
      -webkit-appearance: none;
      width: 100%;
    }
    input[type="url"]::placeholder { color: rgba(255,255,255,0.3); }
    input[type="url"]:focus { border-color: rgba(255,255,255,0.4); }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }
    .btn-primary { background: #f5f0e8; color: #344e41; }

    #auto-area {
      width: 100%;
      max-width: 420px;
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }
    .auto-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: rgba(255,255,255,0.7);
    }
    .auto-row input { width: 18px; height: 18px; accent-color: #f5f0e8; }

    .countdown {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      font-size: 13px;
      color: rgba(255,255,255,0.85);
    }
    .countdown.hidden { display: none; }
    .cancel-btn {
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.25);
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

<div id="screen">
  <div class="logo">CRITERIA</div>

  <div class="tabs" id="tabs">
    <button class="tab" id="tab-prod">PROD</button>
    <button class="tab" id="tab-dev">DEV</button>
  </div>

  <!-- PROD panel -->
  <div id="panel-prod" class="panel">
    <p class="label">PRODUCTION</p>
    <p class="url" id="prod-url-display"></p>
    <button class="btn btn-primary" id="prod-connect">Open production</button>
  </div>

  <!-- DEV panel -->
  <div id="panel-dev" class="panel hidden">
    <p class="label">DEVELOPMENT</p>
    <div class="presets" id="presets"></div>
    <input
      id="dev-url-input"
      type="url"
      inputmode="url"
      autocomplete="off"
      autocorrect="off"
      autocapitalize="none"
      spellcheck="false"
      placeholder="http://192.168.x.x:5173"
    />
    <button class="btn btn-primary" id="dev-connect">Connect</button>
    <p class="hint">
      iOS sim: <code style="background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px">localhost:5173</code> ·
      Android emu: <code style="background:rgba(255,255,255,.08);padding:1px 5px;border-radius:3px">10.0.2.2:5173</code> ·
      Real device: your Mac's LAN IP
    </p>
  </div>

  <!-- Auto-connect + countdown -->
  <div id="auto-area">
    <div id="countdown" class="countdown hidden">
      <span>Connecting in <span id="countdown-num">2</span>s…</span>
      <button class="cancel-btn" id="cancel-btn">Cancel</button>
    </div>
    <label class="auto-row">
      <input type="checkbox" id="auto-toggle">
      <span>Auto-connect on next launch</span>
    </label>
  </div>
</div>

<script>
  // ── Config (edited at sync time from dev.config.json) ───────────────────────
  // Production URL — points to the deployed webapp.
  // Set this to your real prod URL (e.g. https://criteria.vercel.app).
  var PROD_URL = 'https://criteria.app'

  // Default DEV URL, used as the initial value for the dev URL input.
  // Overwritten at `npx cap sync` time from `mobile/dev.config.json`.
  var DEFAULT_DEV_URL = 'http://localhost:5173'

  // Built-in DEV presets shown as quick-pick chips.
  var DEV_PRESETS = [
    { label: 'iOS sim',      url: 'http://localhost:5173' },
    { label: 'Android emu',  url: 'http://10.0.2.2:5173' },
  ]

  // ── Storage keys ────────────────────────────────────────────────────────────
  var KEY_ENV  = 'criteria_env'        // 'prod' | 'dev'
  var KEY_URL  = 'criteria_dev_url'    // last DEV URL chosen
  var KEY_AUTO = 'criteria_auto'       // '1' | '0'

  // ── DOM ─────────────────────────────────────────────────────────────────────
  var tabProd       = document.getElementById('tab-prod')
  var tabDev        = document.getElementById('tab-dev')
  var panelProd     = document.getElementById('panel-prod')
  var panelDev      = document.getElementById('panel-dev')
  var prodUrlEl     = document.getElementById('prod-url-display')
  var prodConnect   = document.getElementById('prod-connect')
  var devInput      = document.getElementById('dev-url-input')
  var devConnect    = document.getElementById('dev-connect')
  var presetsEl     = document.getElementById('presets')
  var autoToggle    = document.getElementById('auto-toggle')
  var countdownEl   = document.getElementById('countdown')
  var countdownNum  = document.getElementById('countdown-num')
  var cancelBtn     = document.getElementById('cancel-btn')

  prodUrlEl.textContent = PROD_URL

  // ── State ───────────────────────────────────────────────────────────────────
  var savedEnv  = localStorage.getItem(KEY_ENV) || 'prod'
  var savedUrl  = localStorage.getItem(KEY_URL) || DEFAULT_DEV_URL
  var autoOn    = localStorage.getItem(KEY_AUTO) === '1'

  devInput.value = savedUrl
  autoToggle.checked = autoOn
  setActiveTab(savedEnv)

  // ── Presets ─────────────────────────────────────────────────────────────────
  DEV_PRESETS.concat([{ label: 'Saved (' + DEFAULT_DEV_URL.replace(/^https?:\/\//, '') + ')', url: DEFAULT_DEV_URL }])
    .filter(function (p, i, arr) {
      return arr.findIndex(function (x) { return x.url === p.url }) === i
    })
    .forEach(function (preset) {
      var btn = document.createElement('button')
      btn.className = 'preset'
      btn.type = 'button'
      btn.textContent = preset.label
      btn.onclick = function () { devInput.value = preset.url }
      presetsEl.appendChild(btn)
    })

  // ── Tabs ────────────────────────────────────────────────────────────────────
  function setActiveTab(env) {
    var isProd = env === 'prod'
    tabProd.classList.toggle('active', isProd)
    tabDev.classList.toggle('active', !isProd)
    panelProd.classList.toggle('hidden', !isProd)
    panelDev.classList.toggle('hidden', isProd)
  }
  tabProd.onclick = function () { cancelCountdown(); setActiveTab('prod') }
  tabDev.onclick  = function () { cancelCountdown(); setActiveTab('dev') }

  // ── Connect actions ─────────────────────────────────────────────────────────
  function persistAuto() { localStorage.setItem(KEY_AUTO, autoToggle.checked ? '1' : '0') }
  autoToggle.addEventListener('change', persistAuto)

  function go(env, url) {
    localStorage.setItem(KEY_ENV, env)
    if (env === 'dev') localStorage.setItem(KEY_URL, url)
    persistAuto()
    // Cache-bust to defeat any WKWebView module caching.
    var sep = url.indexOf('?') === -1 ? '?' : '&'
    window.location.replace(url + sep + '_b=' + Date.now())
  }

  prodConnect.onclick = function () {
    cancelCountdown()
    go('prod', PROD_URL)
  }
  devConnect.onclick = function () {
    cancelCountdown()
    var url = devInput.value.trim()
    if (!url) return
    if (!/^https?:\/\//i.test(url)) url = 'http://' + url
    url = url.replace(/\/$/, '')
    go('dev', url)
  }

  // ── Auto-connect countdown ──────────────────────────────────────────────────
  var countdownTimer = null
  function startCountdown() {
    var n = 2
    countdownNum.textContent = String(n)
    countdownEl.classList.remove('hidden')
    countdownTimer = setInterval(function () {
      n--
      countdownNum.textContent = String(n)
      if (n <= 0) {
        clearInterval(countdownTimer); countdownTimer = null
        countdownEl.classList.add('hidden')
        if (savedEnv === 'prod') go('prod', PROD_URL)
        else                     go('dev', savedUrl)
      }
    }, 1000)
  }
  function cancelCountdown() {
    if (countdownTimer) {
      clearInterval(countdownTimer); countdownTimer = null
      countdownEl.classList.add('hidden')
    }
  }
  cancelBtn.onclick = cancelCountdown

  // Boot: if user opted in to auto-connect, start the 2-second countdown.
  if (autoOn) startCountdown()
</script>
</body>
</html>
