<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <title>Page not found | CRITERIA</title>
    <style>
      :root { color-scheme: light; --paper:#faf8f4; --surface:#fff; --ink:#1a2e22; --muted:#56665b; --line:#dcd9cf; --action:#344e41; --action-text:#fff; }
      :root.dark { color-scheme: dark; --paper:#0f1a15; --surface:#1a2e22; --ink:#f1eee7; --muted:#c3d2c5; --line:#42594b; --action:#385f4d; --action-text:#fff; }
      * { box-sizing:border-box; }
      body { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; margin:0; background:var(--paper); color:var(--ink); font-family:Inter,system-ui,-apple-system,sans-serif; }
      a { color:inherit; }
      a:focus-visible { outline:3px solid #84a98c; outline-offset:3px; }
      main { width:min(100%,1040px); flex:1; margin:auto; padding:7vw 28px; }
      .brand { display:inline-flex; align-items:center; gap:11px; text-decoration:none; font-size:14px; font-weight:750; letter-spacing:.16em; }
      .brand img { width:36px; height:36px; border-radius:7px; }
      .crumb { margin:80px 0 42px; color:var(--muted); font-size:13px; }
      .crumb a { text-underline-offset:4px; }
      .eyebrow { color:#9b513c; font-size:12px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
      h1 { max-width:880px; margin:16px 0 24px; font-size:clamp(3.2rem,9vw,7.5rem); line-height:.95; letter-spacing:-.045em; }
      p { max-width:480px; color:var(--muted); font-size:16px; line-height:1.6; }
      .actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
      .actions a { display:inline-flex; min-height:48px; align-items:center; padding:0 20px; border:1px solid var(--line); border-radius:8px; background:var(--surface); font-size:14px; font-weight:700; text-decoration:none; }
      .actions a:first-child { border-color:var(--action); background:var(--action); color:var(--action-text); }
      footer { border-top:1px solid var(--line); padding:26px 28px; background:var(--surface); }
      footer div { display:flex; flex-wrap:wrap; gap:12px 24px; width:min(100%,984px); margin:auto; color:var(--muted); font-size:13px; }
      footer a { text-underline-offset:4px; }
      @media (max-width:600px) { main { padding:32px 24px 64px; } .crumb { margin:68px 0 38px; } footer { padding:26px 24px; } }
    </style>
    <script>
      try {
        const theme = localStorage.getItem('criteria-theme')
        const dark = theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch { /* storage can be unavailable */ }
    </script>
  </head>
  <body>
    <main>
      <a href="/" class="brand"><img src="/icon-192.png" alt="" width="36" height="36" />CRITERIA</a>
      <nav class="crumb" aria-label="Breadcrumb"><a href="/">Home</a> / <span aria-current="page">Page not found</span></nav>
      <span class="eyebrow">404 · Wrong turn</span>
      <h1>No match for this address.</h1>
      <p>This page may have moved, or the link may be incomplete. Return to CRITERIA to continue.</p>
      <div class="actions"><a href="/">Go to CRITERIA home</a><a href="/sign-in">Sign in</a></div>
    </main>
    <footer><div><span>© CRITERIA</span><a href="/#faq">Frequently asked questions</a><a href="/privacy">Privacy policy</a><a href="/terms">Terms and conditions</a><a href="mailto:criteriaappportugal@gmail.com">Contact</a></div></footer>
  </body>
</html>
