    <link rel="canonical" href="https://criteria-app.com/" />
    <script>
      (() => {
        try {
          if (localStorage.getItem('criteria-language') === 'en') document.documentElement.lang = 'en-GB'
        } catch { /* local storage can be unavailable in private mode */ }
        let preference = 'system'
        try {
          const saved = localStorage.getItem('criteria-theme')
          if (saved === 'light' || saved === 'dark' || saved === 'system') preference = saved
        } catch { /* local storage can be unavailable in private mode */ }
        const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.themePreference = preference
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name="theme-color"]').content = dark ? '#14241d' : '#344e41'
      })()
    </script>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>CRITERIA | Encontre casa. Encontre comprador.</title>
