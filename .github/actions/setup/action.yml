name: Setup pnpm & Node
description: Installs pnpm, sets up Node.js with cache, and runs pnpm install.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: latest

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - run: pnpm install
      shell: bash
