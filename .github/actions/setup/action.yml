name: Setup pnpm & Node
description: Installs pnpm, sets up Node.js with cache, and runs pnpm install.

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        # Pinned to 10.x — pnpm 11 requires Node 22.13+ and we're on Node 22.
        # Bump together with Node if/when we move to pnpm 11.
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - run: pnpm install
      shell: bash
